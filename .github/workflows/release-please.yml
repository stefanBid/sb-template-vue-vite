name: Release Please

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Template-only: projects created from this template skip it (see README, "Versioning and branches").
    if: github.repository == 'stefanBid/sb-template-vue-vite'
    runs-on: ubuntu-latest

    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          release-type: node
