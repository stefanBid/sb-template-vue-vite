<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Web application: keep it out of search engines (see also public/robots.txt) -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="" />
    <meta name="theme-color" content="#0f0f20" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Your Site Name</title>
    <!--
      Applies the saved theme before the first paint, so dark mode never flashes light.
      Same storage key and attribute as useAppColorMode (src/composables/useAppColorMode.ts).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sb-color-mode')
          var isDark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light')
        }
        catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
